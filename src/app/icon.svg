<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="mGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C7F36B" />
      <stop offset="100%" stop-color="#8CE020" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1C18" />
      <stop offset="100%" stop-color="#0E0F0D" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#2A2E24" stroke-width="2"/>

  <!-- Subtle Arc Ring Accent -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="#C7F36B" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Glowing Misthos 'M' Symbolon with Oracle Diamond -->
  <g filter="url(#neonGlow)">
    <!-- Left Pillar -->
    <path d="M16 46 V22 L26 34" stroke="url(#mGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Right Pillar -->
    <path d="M48 46 V22 L38 34" stroke="url(#mGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Central Oracle Attestation Diamond -->
    <polygon points="32,23 37,30 32,37 27,30" fill="#C7F36B" />
    <!-- Settlement Dot -->
    <circle cx="32" cy="44" r="2.5" fill="#C7F36B"/>
  </g>
</svg>
